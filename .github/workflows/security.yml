name: Security checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sync/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Install lobby dependencies
        working-directory: sync
        run: npm ci

      - name: Run tests
        run: npm run test:scripts && npm --prefix sync test

      - name: Audit dependencies
        run: npm audit --audit-level=high && npm --prefix sync audit --audit-level=high

      - name: Build production site
        run: npm run build

      - name: Verify production artifact
        run: npm run test:build

      - name: Validate Worker bundle
        working-directory: sync
        run: npx wrangler deploy --dry-run
